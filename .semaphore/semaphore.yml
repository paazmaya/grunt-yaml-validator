# https://docs.semaphoreci.com/reference/pipeline-yaml
version: v1.0
name: Ubuntu Based Pipeline
agent:
  machine:
    type: e1-standard-2
    # https://docs.semaphoreci.com/reference/os-ubuntu-images/ubuntu-2004-image
    os_image: ubuntu2004

blocks:
  - name: Test with Node.js v24
    task:
      prologue:
        commands:
          - checkout
          - sem-version node 24
          - cache restore node-modules-$(checksum package-lock.json)
          - npm ci --ignore-scripts
          - cache store node-modules-$(checksum package-lock.json) node_modules
      jobs:
        - name: Lint
          commands:
            - npm run lint
        - name: Unit test
          commands:
          - npm test
